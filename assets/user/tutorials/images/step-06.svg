<svg xmlns="http://www.w3.org/2000/svg" width="420" height="510" viewBox="0 0 420 510" role="img" aria-labelledby="title desc"><title id="title">第 6 步：确认订单与实际余额</title><desc id="desc">本站原创操作示意，不是真实交易订单；实际入口和信息以币安页面为准。</desc><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="420" height="510" rx="0" fill="#edf2fd" stroke="none"/><text x="24" y="30" font-size="11" fill="#59667b" font-weight="550" text-anchor="start">操作示意</text><text x="396" y="30" font-size="11" fill="#59667b" font-weight="500" text-anchor="end">06 / 06</text><rect x="24" y="48" width="372" height="429" rx="20" fill="#fff" stroke="#dce2ec"/><text x="48" y="82" font-size="18" fill="#202938" font-weight="650" text-anchor="start">确认订单与实际余额</text><path d="M48 101H372" stroke="#e1e6ef"/><rect x="48" y="124" width="324" height="67" rx="12" fill="#f4f6fa" stroke="none"/><text x="68" y="151" font-size="16" fill="#59667b" font-weight="550" text-anchor="start">等待卖家确认</text><text x="68" y="175" font-size="12" fill="#59667b" font-weight="400" text-anchor="start">处理中，还需要等待放币。</text><path d="M210 204v24m-5-5 5 5 5-5" stroke="#8c9bb5" stroke-width="2" fill="none"/><rect x="48" y="243" width="324" height="67" rx="12" fill="#eaf0ff" stroke="#c5d3f4"/><text x="68" y="270" font-size="17" fill="#315bc9" font-weight="650" text-anchor="start">买币订单已完成</text><text x="68" y="294" font-size="12" fill="#59667b" font-weight="400" text-anchor="start">卖家已确认收款并放币。</text><path d="M210 323v24m-5-5 5 5 5-5" stroke="#8c9bb5" stroke-width="2" fill="none"/><rect x="48" y="362" width="324" height="75" rx="12" fill="#fff" stroke="#315bc9"/><text x="68" y="390" font-size="17" fill="#202938" font-weight="650" text-anchor="start">打开资金账户，查看 USDT</text><text x="68" y="417" font-size="12" fill="#59667b" font-weight="400" text-anchor="start">以自己账户的实际到账余额为准。</text><text x="48" y="460" font-size="11" fill="#59667b" font-weight="400" text-anchor="start">到账后，可提现余额仍以平台提示为准。</text><text x="210" y="497" font-size="10" fill="#59667b" font-weight="400" text-anchor="middle">仅作指引 · 请以自己的实时页面为准</text></g></svg>