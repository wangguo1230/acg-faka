<svg xmlns="http://www.w3.org/2000/svg" width="420" height="510" viewBox="0 0 420 510" role="img" aria-labelledby="title desc"><title id="title">第 5 步：先转账，再通知卖家</title><desc id="desc">本站原创操作示意，不是真实交易订单；实际入口和信息以币安页面为准。</desc><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="420" height="510" rx="0" fill="#edf2fd" stroke="none"/><text x="24" y="30" font-size="11" fill="#59667b" font-weight="550" text-anchor="start">操作示意</text><text x="396" y="30" font-size="11" fill="#59667b" font-weight="500" text-anchor="end">05 / 06</text><rect x="24" y="48" width="372" height="429" rx="20" fill="#fff" stroke="#dce2ec"/><text x="48" y="82" font-size="18" fill="#202938" font-weight="650" text-anchor="start">先转账，再通知卖家</text><path d="M48 101H372" stroke="#e1e6ef"/><rect x="48" y="126" width="24" height="24" rx="12" fill="#315bc9" stroke="none"/><text x="60" y="143" font-size="13" fill="#fff" font-weight="650" text-anchor="middle">1</text><text x="88" y="144" font-size="18" fill="#202938" font-weight="650" text-anchor="start">实际转账成功</text><text x="88" y="172" font-size="12" fill="#59667b" font-weight="400" text-anchor="start">在支付应用中确认结果，保存凭证。</text><path d="M60 188v29m-5-5 5 5 5-5" stroke="#8c9bb5" stroke-width="2" fill="none"/><rect x="48" y="235" width="24" height="24" rx="12" fill="#315bc9" stroke="none"/><text x="60" y="252" font-size="13" fill="#fff" font-weight="650" text-anchor="middle">2</text><text x="88" y="253" font-size="18" fill="#202938" font-weight="650" text-anchor="start">回到币安这笔订单</text><rect x="88" y="273" width="284" height="47" rx="9" fill="#f4ce43" stroke="none"/><text x="230" y="302" font-size="13" fill="#242a35" font-weight="650" text-anchor="middle">我已完成付款，通知卖家</text><path d="M60 336v26m-5-5 5 5 5-5" stroke="#8c9bb5" stroke-width="2" fill="none"/><rect x="48" y="378" width="24" height="24" rx="12" fill="#315bc9" stroke="none"/><text x="60" y="395" font-size="13" fill="#fff" font-weight="650" text-anchor="middle">3</text><text x="88" y="396" font-size="18" fill="#202938" font-weight="650" text-anchor="start">等待卖家核实收款</text><text x="48" y="444" font-size="12" fill="#81561c" font-weight="400" text-anchor="start">提示：点击「已付款」不会自动转账。</text><text x="210" y="497" font-size="10" fill="#59667b" font-weight="400" text-anchor="middle">仅作指引 · 请以自己的实时页面为准</text></g></svg>