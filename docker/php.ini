date.timezone = Asia/Shanghai

memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; 插件/模板文件多，加大 realpath 缓存能省掉大量 stat
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; session 硬化（session.harden 由 docker/php-rebuild.sh 打的补丁提供）：session 反序列化
; 一律拒绝对象（变成 __PHP_Incomplete_Class，不触发 __wakeup/__destruct），
; upload_progress 的 key 去掉 | 和 ! 分隔符。核心只往 session 存标量和数组，不受影响。
session.harden = 1
session.use_strict_mode = 1
session.use_only_cookies = 1

; Redis 会话地址由 docker-deploy 的 entrypoint 根据 REDIS_* 环境变量生成。
